services:
  clubsafe:
    image: ghcr.io/marc78330/alerte:main
    container_name: clubsafe
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Chemin SQLite stocké sur le volume persistant
      DATABASE_URL: "file:/data/clubsafe.db"
      # ⚠️ À remplacer par une valeur longue et aléatoire (ex: openssl rand -hex 32)
      SESSION_SECRET: "remplace-moi-par-un-secret-long-et-aleatoire"
      # URL publique du service (utilisée pour le routage des domaines custom)
      APP_URL: "http://localhost:3000"
      # Met "false" après la première installation
      SEED_ON_START: "true"
    volumes:
      - clubsafe-data:/data
      - clubsafe-storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  clubsafe-data:
    name: clubsafe-data
  clubsafe-storage:
    name: clubsafe-storage